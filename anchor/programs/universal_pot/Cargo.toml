[package]
name = "universal_pot"
version = "0.1.0"
description = "Universal Pot program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "universal_pot"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
test-bpf = []
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }

